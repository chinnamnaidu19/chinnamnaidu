name: Flask CodeDeploy CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Install AWS CLI
        run: |
          aws --version

      - name: Package application
        run: |
          zip -r deployment.zip . \
            -x ".git/*" \
               ".github/*" \
               "__pycache__/*" \
               "*.pyc"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deployment.zip \
            "s3://${{ secrets.CODEDEPLOY_S3_BUCKET }}/deployment-${{ github.sha }}.zip"

      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name application-name \
            --deployment-group-name AppDevelopmentGroupName \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=${{ secrets.CODEDEPLOY_S3_BUCKET }},key=deployment-${{ github.sha }}.zip,bundleType=zip
